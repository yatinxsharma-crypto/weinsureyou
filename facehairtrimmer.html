<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Massi ke liye 💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #ff4d8f;
      --pink-pale: #fff0f6;
      --purple: #9b5de5;
      --yellow: #ffd166;
      --text-dark: #2d2d2d;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #ffe0ee 0%, #f9f0ff 50%, #ffe0ee 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .dot { position: absolute; opacity: 0; animation: fall linear infinite; }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .card {
      position: relative; z-index: 10;
      background: #ffffff;
      border-radius: 28px;
      padding: 44px 40px 36px;
      max-width: 440px;
      width: 92%;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(255,77,143,0.12), 0 24px 64px rgba(255,77,143,0.18), 0 4px 16px rgba(0,0,0,0.06);
      animation: cardPop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardPop {
      from { transform: scale(0.4) translateY(40px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    .tag {
      display: inline-block;
      background: linear-gradient(135deg, #ff4d8f, #9b5de5);
      color: white; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 5px 14px; border-radius: 100px; margin-bottom: 20px;
    }
    .headline { font-size: 1.45rem; font-weight: 800; color: var(--text-dark); line-height: 1.4; margin-bottom: 6px; }
    .headline span { color: var(--pink); }
    .sub { font-size: 0.88rem; color: #999; margin-bottom: 22px; }
    .img-wrap { position: relative; display: inline-block; margin-bottom: 22px; }
    .img-wrap img {
      width: 170px; height: 170px; object-fit: cover;
      border-radius: 20px; border: 3px solid #ffe0ee; display: block;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .img-wrap:hover img { transform: scale(1.07) rotate(-2deg); }
    .badge {
      position: absolute; top: -10px; right: -10px;
      background: var(--yellow); color: #7a5a00;
      font-size: 10px; font-weight: 800;
      padding: 4px 9px; border-radius: 100px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); letter-spacing: 0.5px;
    }
    .msg {
      background: var(--pink-pale); border: 1.5px dashed #ffb3ce;
      border-radius: 16px; padding: 16px 20px; margin-bottom: 24px;
    }
    .msg p { font-size: 1rem; font-weight: 700; color: #c2185b; line-height: 1.65; }
    .msg .laugh { font-size: 1.6rem; display: block; margin-top: 6px; animation: laughBounce 0.6s ease-in-out infinite alternate; }
    @keyframes laughBounce {
      from { transform: scale(1); }
      to   { transform: scale(1.2) rotate(5deg); }
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #ff4d8f 0%, #c2185b 100%);
      color: white; font-family: 'Poppins', sans-serif;
      font-size: 1rem; font-weight: 700;
      padding: 15px 36px; border-radius: 100px;
      border: none; cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,77,143,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: btnPulse 2s ease-in-out infinite;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 12px 32px rgba(255,77,143,0.55); }
    .btn:active { transform: scale(0.98); }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 6px 24px rgba(255,77,143,0.45); }
      50%       { box-shadow: 0 10px 36px rgba(255,77,143,0.7); }
    }
    .divider { height: 1.5px; background: linear-gradient(90deg, transparent, #ffb3ce, transparent); border: none; margin: 20px 0; }
    .footer { margin-top: 18px; font-size: 0.75rem; color: #ccc; }
  </style>
</head>
